<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Black Hole · Scroll Animation</title>
  <meta name="description" content="A scroll-linked animation where a cartoon character's mouth opens wider and wider, growing a black hole that swallows the page." />

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* ─── Reset & base ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      scroll-behavior: auto; /* We handle smoothness ourselves */
      font-family: 'Outfit', system-ui, sans-serif;
    }

    body {
      background: #0a0a0a;
      color: #fff;
      overflow-x: hidden;
    }

    /* ─── Scroll section ────────────────────────────────────────────────── */
    /*  300vh tall. The sticky child stays pinned for all 300vh of scroll   */
    #scroll-section {
      position: relative;
      height: 300vh;
    }

    /* ─── Sticky viewport wrapper ───────────────────────────────────────── */
    #sticky-wrap {
      position: sticky;
      top: 0;
      height: 100svh;
      width: 100%;
      overflow: hidden;
      background: #fffbf2; /* cream — matches the video background */
    }

    /* ─── VIDEO layer ───────────────────────────────────────────────────── */
    /*  Sits beneath everything. Hidden while Canvas fallback is active.    */
    #anim-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none; /* shown only when video loads successfully */
      z-index: 0;
    }

    /* ─── Canvas fallback ───────────────────────────────────────────────── */
    #anim-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* ─── Overlay dark veil (for the pure-black effect when no video) ──── */
    /*  Driven by JS - opacity tracks scroll progress                       */
    #veil {
      position: absolute;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* ─── Text content ──────────────────────────────────────────────────── */
    #hero-text {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 10;
      padding: 2rem;
      pointer-events: none;
      /* Fades out as black fills */
      transition: none;
    }

    .hero-eyebrow {
      font-size: clamp(0.65rem, 1.5vw, 0.8rem);
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #6b5c3e;
      margin-bottom: 1rem;
      opacity: 0.85;
    }

    .hero-name {
      font-size: clamp(2.8rem, 8vw, 7rem);
      font-weight: 800;
      line-height: 1;
      color: #1a1209;
      /* soft text-shadow so it reads on cream */
      text-shadow: 0 2px 32px rgba(255,251,242,0.9), 0 0 64px rgba(255,251,242,0.6);
      letter-spacing: -0.03em;
    }

    .hero-tagline {
      margin-top: 1.2rem;
      font-size: clamp(1rem, 2.5vw, 1.35rem);
      font-weight: 300;
      color: #4a3a22;
      max-width: 540px;
      line-height: 1.6;
      text-shadow: 0 1px 16px rgba(255,251,242,0.8);
    }

    .hero-scroll-hint {
      margin-top: 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #8a7256;
    }

    .scroll-arrow {
      width: 20px;
      height: 20px;
      border-right: 2px solid #8a7256;
      border-bottom: 2px solid #8a7256;
      transform: rotate(45deg);
      animation: bounce 1.6s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: rotate(45deg) translateY(0); opacity: 1; }
      50%       { transform: rotate(45deg) translateY(5px); opacity: 0.4; }
    }

    /* ─── After-section content ─────────────────────────────────────────── */
    #after-section {
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 4rem 2rem;
    }

    .after-title {
      font-size: clamp(2rem, 6vw, 4.5rem);
      font-weight: 800;
      background: linear-gradient(135deg, #fff 30%, #888 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
    }

    .after-sub {
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      color: #666;
      max-width: 480px;
      line-height: 1.7;
      font-weight: 300;
    }

    /* ─── Scrollbar styling ─────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #666; }

    /* ─── Reduced-motion override ───────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      #sticky-wrap { position: relative; height: 100svh; }
      #scroll-section { height: 100svh; }
      #anim-video { display: block; }
      #anim-canvas { display: none; }
      .scroll-arrow { animation: none; }
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════
     SCROLL SECTION  (300vh tall)
     ═══════════════════════════════════════════════════════ -->
<section id="scroll-section" aria-label="Animated hero">

  <div id="sticky-wrap">

    <!-- VIDEO — shown when anim.mp4 exists -->
    <video
      id="anim-video"
      src="anim.mp4"
      poster="poster.jpg"
      muted
      playsinline
      preload="auto"
      aria-hidden="true"
    ></video>

    <!-- CANVAS FALLBACK — procedural cartoon face drawn with JS -->
    <canvas id="anim-canvas" aria-hidden="true"></canvas>

    <!-- Dark veil that grows over everything (canvas mode only) -->
    <div id="veil" aria-hidden="true"></div>

    <!-- TEXT OVERLAY -->
    <div id="hero-text">
      <p class="hero-eyebrow">Scroll to see the universe</p>
      <h1 class="hero-name">Your&nbsp;Name</h1>
      <p class="hero-tagline">
        A creative developer who builds things that feel alive.
        Scroll down and watch the world disappear.
      </p>
      <div class="hero-scroll-hint">
        <span>Scroll</span>
        <div class="scroll-arrow"></div>
      </div>
    </div>

  </div><!-- /sticky-wrap -->

</section><!-- /scroll-section -->

<!-- ═══════════════════════════════════════════════════════
     CONTENT AFTER THE BLACK HOLE
     ═══════════════════════════════════════════════════════ -->
<section id="after-section">
  <h2 class="after-title">You made it through.</h2>
  <p class="after-sub">
    The universe swallowed itself. Now scroll back up and watch it return.
    This is what happens when design meets physics.
  </p>
</section>

<!-- ═══════════════════════════════════════════════════════
     JAVASCRIPT
     ═══════════════════════════════════════════════════════ -->
<script>
/* ─────────────────────────────────────────────────────────────────────────
   CONFIGURATION
   ───────────────────────────────────────────────────────────────────────── */
const LERP_FACTOR = 0.08;   // smoothing factor (lower = more inertia)
const TEXT_FADE_START = 0.15; // progress at which text starts fading
const TEXT_FADE_END   = 0.45; // progress at which text is fully gone

/* ─────────────────────────────────────────────────────────────────────────
   ELEMENTS
   ───────────────────────────────────────────────────────────────────────── */
const scrollSection = document.getElementById('scroll-section');
const stickyWrap    = document.getElementById('sticky-wrap');
const video         = document.getElementById('anim-video');
const canvas        = document.getElementById('anim-canvas');
const veil          = document.getElementById('veil');
const heroText      = document.getElementById('hero-text');

/* ─────────────────────────────────────────────────────────────────────────
   REDUCED MOTION CHECK
   ───────────────────────────────────────────────────────────────────────── */
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ─────────────────────────────────────────────────────────────────────────
   VIDEO MODE  —  active when anim.mp4 loads successfully
   ───────────────────────────────────────────────────────────────────────── */
let videoMode = false;
let videoDuration = 0;
let videoCurrentTime = 0; // our smoothed currentTime target (lerped)

video.addEventListener('loadedmetadata', () => {
  if (video.readyState >= 1 && isFinite(video.duration) && video.duration > 0) {
    videoDuration = video.duration;
    videoMode = true;

    // Show video, hide canvas
    video.style.display = 'block';
    canvas.style.display = 'none';
    veil.style.display   = 'none';

    // Pause immediately — scroll drives it
    video.pause();
    video.currentTime = 0;

    console.log('[BlackHole] Video mode active. Duration:', videoDuration.toFixed(2), 's');
  }
});

video.addEventListener('error', () => {
  console.log('[BlackHole] Video not found — using canvas fallback.');
});

/* ─────────────────────────────────────────────────────────────────────────
   SCROLL PROGRESS  ─  raw [0, 1]
   ───────────────────────────────────────────────────────────────────────── */
function getScrollProgress() {
  const rect = scrollSection.getBoundingClientRect();
  const sectionHeight = scrollSection.offsetHeight;
  const viewportH = window.innerHeight;

  // Distance scrolled into the section
  const scrolled = -rect.top;
  // Total scrollable range = sectionHeight - viewportH
  const range = sectionHeight - viewportH;
  return Math.min(1, Math.max(0, scrolled / range));
}

/* ─────────────────────────────────────────────────────────────────────────
   TEXT OPACITY  ─  based on progress
   ───────────────────────────────────────────────────────────────────────── */
function updateTextOpacity(progress) {
  let opacity;
  if (progress <= TEXT_FADE_START) {
    opacity = 1;
  } else if (progress >= TEXT_FADE_END) {
    opacity = 0;
  } else {
    const t = (progress - TEXT_FADE_START) / (TEXT_FADE_END - TEXT_FADE_START);
    // ease-in quad
    opacity = 1 - t * t;
  }
  heroText.style.opacity = opacity;
  // Also shift the text upward slightly as it fades
  heroText.style.transform = `translateY(${-(progress * 40)}px)`;
}

/* ─────────────────────────────────────────────────────────────────────────
   RAF LOOP  ─  VIDEO MODE
   ───────────────────────────────────────────────────────────────────────── */
let targetTime = 0;
let smoothTime  = 0;
let rafId = null;

function rafLoopVideo() {
  rafId = requestAnimationFrame(rafLoopVideo);

  const progress = getScrollProgress();
  targetTime = progress * videoDuration;
  updateTextOpacity(progress);

  // Lerp toward target
  smoothTime += (targetTime - smoothTime) * LERP_FACTOR;

  // Guard: only write if meaningfully different (avoids forced paints)
  if (Math.abs(video.currentTime - smoothTime) > 0.01) {
    video.currentTime = smoothTime;
  }
}

/* ─────────────────────────────────────────────────────────────────────────
   CANVAS FALLBACK  ─  Procedural cartoon face
   ─────────────────────────────────────────────────────────────────────────
   Draws a flat 2D cartoon face on a cream background.
   'progress' drives the animation from 0 (closed) → 1 (all black).
   ───────────────────────────────────────────────────────────────────────── */
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Easing: ease-in-out cubic
function easeInOut(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

// Easing: ease-in quad (for the void spreading)
function easeIn(t) { return t * t; }

function drawFace(progress) {
  const W = canvas.width;
  const H = canvas.height;
  const cx = W / 2;
  const cy = H / 2;

  // Face radius relative to canvas
  const faceR = Math.min(W, H) * 0.22;

  // ── Phase split ──
  // 0→0.5 : mouth opens, void starts
  // 0.5→1 : void explodes to cover the screen
  const mouthPhase = Math.min(1, progress / 0.5);          // 0→1 during first half
  const voidPhase  = Math.max(0, (progress - 0.35) / 0.65); // 0→1 starting at 35%

  const mouthT = easeInOut(mouthPhase);
  const voidT  = easeIn(voidPhase);

  // ── Clear ──
  ctx.clearRect(0, 0, W, H);

  // ── Cream background ──
  ctx.fillStyle = '#fffbf2';
  ctx.fillRect(0, 0, W, H);

  // ── Void (black hole) — drawn UNDER the face, then expands over it ──
  // Void radius: starts tiny inside mouth, grows to cover entire screen
  const maxVoidR = Math.hypot(W, H);   // diagonal — guaranteed to cover
  const voidStartR = faceR * 0.18 * mouthT;  // tracks mouth opening
  const voidR = voidStartR + (maxVoidR - voidStartR) * voidT;

  if (voidT > 0 || mouthT > 0.05) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy + faceR * 0.18, voidR, 0, Math.PI * 2);
    ctx.fillStyle = '#000';
    ctx.fill();
    ctx.restore();
  }

  // ── Draw face (disappears behind the void) ──
  // Face opacity: fades out as void covers it
  const faceAlpha = Math.max(0, 1 - voidT * 2);

  if (faceAlpha > 0.01) {
    ctx.save();
    ctx.globalAlpha = faceAlpha;

    // Face circle
    ctx.beginPath();
    ctx.arc(cx, cy, faceR, 0, Math.PI * 2);
    ctx.fillStyle = '#ffe9b0';
    ctx.fill();
    ctx.strokeStyle = '#2a1a05';
    ctx.lineWidth = faceR * 0.04;
    ctx.stroke();

    // ── Eyes ──
    const eyeY = cy - faceR * 0.2;
    const eyeOffX = faceR * 0.3;
    const eyeR = faceR * 0.09;
    const eyeSquintFactor = 1 - mouthT * 0.6; // squint as mouth opens

    // Left eye
    ctx.save();
    ctx.translate(cx - eyeOffX, eyeY);
    ctx.scale(1, eyeSquintFactor);
    ctx.beginPath();
    ctx.arc(0, 0, eyeR, 0, Math.PI * 2);
    ctx.fillStyle = '#2a1a05';
    ctx.fill();
    ctx.restore();

    // Right eye
    ctx.save();
    ctx.translate(cx + eyeOffX, eyeY);
    ctx.scale(1, eyeSquintFactor);
    ctx.beginPath();
    ctx.arc(0, 0, eyeR, 0, Math.PI * 2);
    ctx.fillStyle = '#2a1a05';
    ctx.fill();
    ctx.restore();

    // Eye shine dots
    [cx - eyeOffX, cx + eyeOffX].forEach(ex => {
      ctx.beginPath();
      ctx.arc(ex + eyeR * 0.25, eyeY - eyeR * 0.25, eyeR * 0.28, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fill();
    });

    // ── Eyebrows ──
    const browY = eyeY - eyeR * 1.8;
    const browRaise = mouthT * faceR * 0.06; // brows raise as mouth opens
    ctx.lineWidth = faceR * 0.045;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#2a1a05';

    // Left brow
    ctx.beginPath();
    ctx.moveTo(cx - eyeOffX - eyeR * 1.1, browY - browRaise + faceR * 0.02);
    ctx.quadraticCurveTo(cx - eyeOffX, browY - browRaise - faceR * 0.05, cx - eyeOffX + eyeR * 1.1, browY - browRaise + faceR * 0.01);
    ctx.stroke();

    // Right brow
    ctx.beginPath();
    ctx.moveTo(cx + eyeOffX - eyeR * 1.1, browY - browRaise + faceR * 0.01);
    ctx.quadraticCurveTo(cx + eyeOffX, browY - browRaise - faceR * 0.05, cx + eyeOffX + eyeR * 1.1, browY - browRaise + faceR * 0.02);
    ctx.stroke();

    // ── Mouth ──
    const mouthCY = cy + faceR * 0.18;
    const mouthW  = faceR * (0.32 + mouthT * 0.55);   // widens as opens
    const mouthH  = faceR * mouthT * 0.75;              // depth of opening

    // Mouth outline (lips)
    ctx.beginPath();
    // Top lip: straight across
    ctx.moveTo(cx - mouthW, mouthCY - mouthH * 0.5);
    ctx.bezierCurveTo(
      cx - mouthW * 0.4, mouthCY - mouthH * 0.6,
      cx + mouthW * 0.4, mouthCY - mouthH * 0.6,
      cx + mouthW, mouthCY - mouthH * 0.5
    );
    // Right side
    ctx.bezierCurveTo(
      cx + mouthW * 1.1, mouthCY - mouthH * 0.1,
      cx + mouthW * 1.0, mouthCY + mouthH * 0.6,
      cx + mouthW * 0.5, mouthCY + mouthH
    );
    // Bottom lip
    ctx.bezierCurveTo(
      cx + mouthW * 0.2, mouthCY + mouthH * 1.1,
      cx - mouthW * 0.2, mouthCY + mouthH * 1.1,
      cx - mouthW * 0.5, mouthCY + mouthH
    );
    // Left side
    ctx.bezierCurveTo(
      cx - mouthW * 1.0, mouthCY + mouthH * 0.6,
      cx - mouthW * 1.1, mouthCY - mouthH * 0.1,
      cx - mouthW, mouthCY - mouthH * 0.5
    );
    ctx.closePath();

    // Fill mouth interior — dark, then consumed by void
    ctx.fillStyle = '#1a0a00';
    ctx.fill();
    ctx.strokeStyle = '#2a1a05';
    ctx.lineWidth = faceR * 0.035;
    ctx.stroke();

    // Small teeth strip at top of mouth (only visible when slightly open)
    if (mouthT > 0.05 && mouthH > faceR * 0.04) {
      const teethH = Math.min(faceR * 0.09, mouthH * 0.45);
      const teethY = mouthCY - mouthH * 0.5 + teethH * 0.1;
      const nTeeth = 5;
      const tw = (mouthW * 1.6) / nTeeth;

      ctx.save();
      // Clip to mouth region (approx rectangle for teeth)
      ctx.beginPath();
      ctx.rect(cx - mouthW, mouthCY - mouthH * 0.6, mouthW * 2, teethH * 2);
      ctx.clip();

      for (let i = 0; i < nTeeth; i++) {
        const tx = cx - mouthW * 0.8 + i * tw + tw * 0.08;
        ctx.beginPath();
        ctx.roundRect(tx, teethY, tw * 0.85, teethH, teethH * 0.25);
        ctx.fillStyle = '#fffef0';
        ctx.fill();
      }
      ctx.restore();
    }

    // Cheek blushes
    const blushAlpha = Math.max(0, 0.35 - mouthT * 0.35) * faceAlpha;
    if (blushAlpha > 0) {
      const blushR = faceR * 0.22;
      const blushY = cy + faceR * 0.1;

      ctx.save();
      ctx.globalAlpha = blushAlpha;

      const lg = ctx.createRadialGradient(cx - faceR * 0.56, blushY, 0, cx - faceR * 0.56, blushY, blushR);
      lg.addColorStop(0, 'rgba(255,120,100,0.6)');
      lg.addColorStop(1, 'rgba(255,120,100,0)');
      ctx.beginPath();
      ctx.arc(cx - faceR * 0.56, blushY, blushR, 0, Math.PI * 2);
      ctx.fillStyle = lg;
      ctx.fill();

      const rg = ctx.createRadialGradient(cx + faceR * 0.56, blushY, 0, cx + faceR * 0.56, blushY, blushR);
      rg.addColorStop(0, 'rgba(255,120,100,0.6)');
      rg.addColorStop(1, 'rgba(255,120,100,0)');
      ctx.beginPath();
      ctx.arc(cx + faceR * 0.56, blushY, blushR, 0, Math.PI * 2);
      ctx.fillStyle = rg;
      ctx.fill();

      ctx.restore();
    }

    ctx.restore(); // end globalAlpha group
  }

  // ── Final veil for pure black at progress=1 ──
  if (voidT > 0.5) {
    const finalAlpha = (voidT - 0.5) / 0.5;
    ctx.fillStyle = `rgba(0,0,0,${finalAlpha * 0.9})`;
    ctx.fillRect(0, 0, W, H);
  }
}

/* ─────────────────────────────────────────────────────────────────────────
   RAF LOOP  ─  CANVAS MODE
   ───────────────────────────────────────────────────────────────────────── */
let smoothProgress = 0;
let targetProgress  = 0;

function rafLoopCanvas() {
  rafId = requestAnimationFrame(rafLoopCanvas);

  targetProgress = getScrollProgress();
  smoothProgress += (targetProgress - smoothProgress) * LERP_FACTOR;

  drawFace(smoothProgress);
  updateTextOpacity(smoothProgress);

  // In canvas mode, the veil div is unused (drawing handles it)
}

/* ─────────────────────────────────────────────────────────────────────────
   TOUCH DEVICE  ─  autoplay loop the video if available, else canvas
   ───────────────────────────────────────────────────────────────────────── */
const isTouchDevice = window.matchMedia('(hover: none) and (pointer: coarse)').matches;

if (prefersReducedMotion) {
  // Show poster or static first frame only
  video.setAttribute('autoplay', '');
  video.setAttribute('loop', '');
  video.style.display = 'block';
  canvas.style.display = 'none';
  video.play().catch(() => {});
} else {
  // Start canvas loop immediately (will be replaced by video loop if video loads)
  rafId = requestAnimationFrame(rafLoopCanvas);

  // When video loads, switch over to video RAF loop
  video.addEventListener('loadedmetadata', () => {
    if (videoMode) {
      cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(rafLoopVideo);
    }
  });

  if (isTouchDevice) {
    // On touch: autoplay-loop the video, or keep the canvas loop
    video.setAttribute('autoplay', '');
    video.setAttribute('loop', '');
    video.play().catch(() => {});
  }
}

/* ─────────────────────────────────────────────────────────────────────────
   FFMPEG HINT  (logged to console for reference)
   ─────────────────────────────────────────────────────────────────────────
   To re-encode anim.mp4 for instant scrubbing:
   
   ffmpeg -i raw_anim.mp4 \
     -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2" \
     -c:v libx264 \
     -x264-params "keyint=1:min-keyint=1" \
     -pix_fmt yuv420p \
     -an \
     anim.mp4

   To extract first frame as poster.jpg:
   ffmpeg -i anim.mp4 -vframes 1 -q:v 2 poster.jpg
   ─────────────────────────────────────────────────────────────────────────*/
console.log('%c[BlackHole] ffmpeg re-encode command:', 'color:#f5a623;font-weight:bold');
console.log('ffmpeg -i raw_anim.mp4 -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2" -c:v libx264 -x264-params "keyint=1:min-keyint=1" -pix_fmt yuv420p -an anim.mp4');
console.log('%c[BlackHole] Extract poster:', 'color:#f5a623;font-weight:bold');
console.log('ffmpeg -i anim.mp4 -vframes 1 -q:v 2 poster.jpg');
</script>

</body>
</html>
